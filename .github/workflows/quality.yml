name: Build and verify

on:
  push:
    branches: [main, codex/security-remediation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate static pages
        run: node build_map.js
      - name: Run verification suite
        run: node verify.js
      - name: Confirm generated pages are committed
        run: git diff --exit-code -- index.html gardabani_map.html calendar.html mentors.html settings.html
